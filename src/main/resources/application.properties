# ===================================================================
# Expense Tracker Web Application - Spring Boot Configuration
# ===================================================================
spring.application.name=ExpenseTracker

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (MySQL by default, configurable via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expense_tracker_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Seed Sample Data on First Run (set to false to disable)
app.seed-sample-data=${SEED_SAMPLE_DATA:true}
