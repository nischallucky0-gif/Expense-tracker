# ===================================================================
# Dev Profile - Standalone H2 Database (zero external setup required)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ===================================================================
spring.datasource.url=jdbc:h2:mem:expense_tracker_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.seed-sample-data=true
